openapi: 3.0.3
info:
  title: SIGTAP API
  version: 1.0.0
  description: "API REST de **consulta pública** (somente leitura) às tabelas do **SIGTAP**\\.
    \ \n\nOs endpoints são organizados por contexto: \n\n> hierarquia (**grupos**
    → **subgrupos** → **formas de organização** → **procedimentos**), dimensões versionadas
    por competência e dicionários globais.\n\n> Os recursos versionados aceitam o
    parâmetro `competencia` (`AAAAMM`). Sem ele, considera-se a competência vigente.\n"
paths:
  /api/v1/sigtap/cids/:
    get:
      operationId: cids_list
      description: Dicionário sem competência (classe C).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - CIDs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCidList'
          description: ''
  /api/v1/sigtap/cids/{co_cid}/:
